<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7c744" />
    <title>跳一跳</title>
    <link rel="stylesheet" href="./style.css?v=15" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="跳一跳游戏画面"></canvas>

      <header class="hud" aria-live="polite">
        <div class="score-wrap"><strong id="score">0</strong></div>
        <div class="top-actions" aria-label="游戏工具">
          <button id="help-button" type="button" aria-label="游戏说明">⌁</button>
          <button id="settings-button" type="button" aria-label="更多设置">•••</button>
          <button id="best-button" type="button" aria-label="目标分数">◎</button>
        </div>
      </header>

      <div id="charge-panel" class="charge-panel" aria-hidden="true">
        <div class="charge-copy"><span>蓄力</span><span id="charge-percent">0%</span></div>
        <div class="charge-track"><div id="charge-fill" class="charge-fill"></div></div>
      </div>

      <section id="start-screen" class="overlay-card instruction-card" aria-label="跳一跳操作说明">
        <h1>长按屏幕并释放</h1>
        <p>控制奶龙向前跳</p>
        <div class="control-figure" aria-hidden="true"><span class="figure-frog">●</span><span class="figure-arrow">↗</span></div>
        <button id="start-button" class="primary-button">开始游戏</button>
        <div class="control-hint">手机：按住屏幕　电脑：按住鼠标或空格键</div>
      </section>

      <section id="fail-screen" class="overlay-card fail-card hidden">
        <div id="record-label" class="record-label">本局结束</div>
        <h2>再玩一局</h2>
        <div class="final-score-big" id="final-score">0</div>
        <div class="result-actions">
          <button id="home-button" class="round-button" type="button" aria-label="返回首页">⌂</button>
          <button id="restart-button" class="primary-button" type="button">↻&nbsp; 再玩一局</button>
        </div>
        <div class="control-hint">按住屏幕或空格键开始</div>
      </section>

      <div id="toast" class="toast" role="status"></div>
      <div class="bottom-tools">
        <button id="share-button" type="button" aria-label="分享游戏">↥</button>
        <button id="target-button" type="button" aria-label="查看最高分">◎</button>
      </div>
      <div class="bottom-hint">按住蓄力 · 松开跳跃</div>
    </main>
    <script src="./game.js?v=15"></script>
  </body>
</html>
